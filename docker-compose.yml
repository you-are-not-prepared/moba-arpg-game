# Local game server.  Build it in Unity first (MOBA > Build Linux Server), then:  docker compose up -d --build
# It runs one match at a time and restarts itself (fresh map) when a match ends.
# The UDP port is bound to 127.0.0.1, so only this PC can join.
name: moba-game

services:
  game-server:
    build:
      context: .
      dockerfile: Server/Dockerfile
    restart: unless-stopped
    environment:
      MOBA_MAP: random   # classic | zones | delve | random
      MOBA_BOTS: "3"     # bots per team for the seats players don't fill (0 = players only)
      MOBA_CHEATS: "on"  # cheat menu for testing; set "off" before letting others play
      # Records finished matches on the backend (moba-backend, running on this PC). The key must match the
      # backend's GAME_SERVER_KEY; both default to the same local-only value. Set a real one in .env on a server.
      MOBA_BACKEND_URL: http://host.docker.internal:8080
      MOBA_BACKEND_KEY: ${GAME_SERVER_KEY:-local-dev-only-server-key}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:7777:7777/udp"
